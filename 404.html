<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>הדף לא נמצא · The Daily Jenya</title>
  <link rel="stylesheet" href="assets/fonts.css">
  <style>
    :root { --paper: #edebe4; --ink: #161616; --ink-3: #6b6960; --red: #b3122e; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --paper: #151513; --ink: #e9e6de; --ink-3: #8f8b80; --red: #ff5e6e; color-scheme: dark; } }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
    .plate { font: 700 44px/1 "Newsreader", "Times New Roman", Georgia, serif; direction: ltr; text-align: center; padding-bottom: 12px; border-bottom: 3px solid var(--ink); margin-bottom: 28px; }
    .plate i { font-weight: 400; font-size: 24px; }
    a { color: var(--ink); } a:hover { color: var(--red); }
    p.en { direction: ltr; text-align: left; color: var(--ink-3); }
  </style>
</head>
<body>
  <main>
    <p class="plate"><i>The</i> Daily Jenya</p>
    <p>המהדורה הזו לא נמצאה. אפשר לחזור <a class="home" href="/KNG.3D/">למהדורה האחרונה</a> או <a class="arch" href="/KNG.3D/archive/">לארכיון</a>.</p>
    <p class="en">That edition isn't here. Go to the <a class="home" href="/KNG.3D/">latest edition</a> or the <a class="arch" href="/KNG.3D/archive/">archive</a>.</p>
  </main>
  <script>
    (function () {
      var seg = location.pathname.split("/").filter(Boolean)[0];
      var base = location.hostname.slice(-10) === ".github.io" && seg ? "/" + seg + "/" : "/";
      document.querySelectorAll("a.home").forEach(function (a) { a.href = base; });
      document.querySelectorAll("a.arch").forEach(function (a) { a.href = base + "archive/"; });
    })();
  </script>
</body>
</html>
