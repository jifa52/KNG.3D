name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files
        run: |
          set -euo pipefail
          for f in \
            index.html \
            404.html \
            .nojekyll \
            assets/brief.css \
            assets/edition.css \
            assets/polish.css \
            assets/lanes.js \
            assets/favicon.svg \
            assets/daily-jenya-logo.png \
            assets/images/trump-xi-1280.jpg \
            assets/images/albanese-800.jpg \
            assets/images/yanbu-nasa-1920.jpg \
            assets/images/yanbu-nasa-960.jpg \
            assets/images/tanker-abot-1280.jpg \
            assets/images/datacenter-racks-1280.jpg \
            assets/images/hormuz-nasa-1600.jpg \
            assets/images/hormuz-nasa-960.jpg \
            assets/images/ai-medicare-security.jpg \
            assets/images/ai-muse-charm.jpg \
            assets/images/ai-kyiv-memorial.jpg \
            assets/images/ai-drone-grounded.jpg \
            assets/images/ai-claude-art.jpg \
            assets/images/ai-opus-chip.jpg \
            briefings/2026-09-25-1400/IMAGE-CREDITS.md \
            assets/fonts/FrankRuhlLibre-700-hebrew.woff2 \
            assets/fonts/Heebo-400-hebrew.woff2 \
            archive/index.html \
            preview/ux-2026-09-24/index.html \
            preview/ux-2026-09-24-polish/index.html \
            preview/ux-2026-09-24-polish/IMAGE-CREDITS.md \
            preview/daily-jenya-navy/index.html \
            preview/daily-jenya-navy/navy.css \
            preview/daily-jenya-navy/navy.js \
            briefings/2026-09-24-1545/IMAGE-CREDITS.md \
            templates/edition.html \
            templates/IMAGE-CREDITS.md \
            templates/PUBLISH.md
          do
            test -f "$f"
            echo "ok $f"
          done
          grep -q '#102333' preview/daily-jenya-navy/navy.css
          grep -q '#A5D5FF' preview/daily-jenya-navy/navy.css || grep -q '#a5d5ff' preview/daily-jenya-navy/navy.css
          grep -q 'Your Morning Edition' preview/daily-jenya-navy/index.html
          grep -q 'id="mkt-drivers"' preview/daily-jenya-navy/index.html
          grep -q 'id="mkt-catalysts"' preview/daily-jenya-navy/index.html
          grep -q 'id="mkt-next"' preview/daily-jenya-navy/index.html
          grep -q 'id="mkt-snap"' preview/daily-jenya-navy/index.html
          if grep -E -q 'window\.openai|new Tweak|harbor\.webp|chip\.webp' \
            preview/daily-jenya-navy/index.html \
            preview/daily-jenya-navy/navy.js
          then
            echo "navy preview must not ship the handoff sandbox or sample art"
            exit 1
          fi
          if grep -q 'edition.css' preview/daily-jenya-navy/index.html; then
            echo "navy preview must not load the live sheet"
            exit 1
          fi
          grep -q 'PREVIEW' preview/ux-2026-09-24/index.html
          grep -q 'edition.css' preview/ux-2026-09-24/index.html
          grep -q 'Frank Ruhl Libre' assets/edition.css
          grep -q '#101f2c' assets/edition.css
          grep -q '#09141e' assets/edition.css
          grep -q '#d4dce1' assets/edition.css
          grep -q '#a1b1bd' assets/edition.css
          grep -q '#344653' assets/edition.css
          grep -q '#91c4eb' assets/edition.css
          grep -q 'theme-color" content="#101f2c"' index.html
          grep -q 'crawl-pause' index.html
          grep -q '52s' assets/polish.css
          grep -q 'mkt-snap' assets/polish.css
          grep -q 'mkt-drivers' assets/polish.css
          # Older polish permalinks keep the quote boards. Live and the template are news-first.
          grep -q 'mkt-board-primary' assets/polish.css
          for page in index.html briefings/2026-09-25-1545/index.html briefings/2026-09-25-1400/index.html briefings/2026-09-25-0850/index.html briefings/2026-09-24-1545/index.html templates/edition.html; do
            grep -q 'edition.css' "$page"
            grep -q 'polish.css' "$page"
            grep -q 'edition-nav' "$page"
            grep -q 'id="news"' "$page"
            grep -q 'id="markets"' "$page"
            grep -q 'id="ai"' "$page"
            grep -q 'ai-lead' "$page"
            grep -q '#premarket' "$page"
            if grep -q 'img-ph' "$page"; then
              echo "no gray photo placeholder on $page"
              exit 1
            fi
            if grep -q 'mkt-table' "$page"; then
              echo "markets is not an HTML table on $page"
              exit 1
            fi
          done
          for page in briefings/2026-09-25-0850/index.html briefings/2026-09-24-1545/index.html; do
            grep -q 'mkt-board-primary' "$page"
            grep -q 'mkt-board-secondary' "$page"
            grep -q 'mkt-board-cash' "$page"
          done
          for page in index.html briefings/2026-09-25-1545/index.html briefings/2026-09-25-1400/index.html templates/edition.html; do
            grep -q 'mkt-snap' "$page"
            grep -q 'mkt-strip' "$page"
            grep -q 'mkt-drivers' "$page"
            grep -q 'mkt-catalysts' "$page"
            grep -q 'mkt-next' "$page"
            grep -q 'mkt-brief' "$page"
            if grep -q 'mkt-board-primary' "$page"; then
              echo "live markets is a news brief, not quote boards, on $page"
              exit 1
            fi
          done
          grep -q 'מדד, לא חוזה' index.html
          grep -q 'שער מט״ח' index.html
          grep -q 'Index, not futures' index.html
          grep -q 'FX spot' index.html
          grep -q 'The Daily Jenya' index.html
          grep -q 'daily-jenya-logo.png' index.html
          grep -q 'yanbu-nasa-1920.jpg' index.html
          grep -q 'tanker-abot-1280.jpg' index.html
          grep -q 'datacenter-racks-1280.jpg' index.html
          grep -q 'photo--support' index.html
          grep -q 'keep-photo-slot' templates/edition.html
          grep -q 'class="illus-caption"' templates/edition.html
          grep -q 'AI Illustration' templates/edition.html
          for page in index.html briefings/2026-09-25-1400/index.html briefings/2026-09-25-1545/index.html; do
            for needle in \
              yanbu-nasa-1920.jpg \
              tanker-abot-1280.jpg \
              datacenter-racks-1280.jpg \
              hormuz-nasa-1600.jpg \
              ai-medicare-security.jpg \
              ai-muse-charm.jpg \
              ai-kyiv-memorial.jpg \
              ai-drone-grounded.jpg \
              ai-claude-art.jpg \
              ai-opus-chip.jpg \
              'keep-photo-slot: news-01' \
              'keep-photo-slot: news-08' \
              'class="illus-caption"' \
              'המחשה (AI)' \
              'AI Illustration'
            do
              grep -q "$needle" "$page"
            done
            test "$(grep -c 'keep-photo-slot:' "$page")" -ge 10
          done
          grep -q 'photo--support' briefings/2026-09-25-1400/index.html
          grep -q 'photo--support' templates/edition.html
          grep -q 'figure class="photo"' templates/edition.html
          # AI pictures: a quiet caption under the image. No forest badge and no long disclaimer.
          for page in index.html briefings/2026-09-25-1545/index.html briefings/2026-09-25-1400/index.html templates/edition.html; do
            if grep -q 'illus-label' "$page"; then
              echo "no AI badge on $page"
              exit 1
            fi
            if grep -q 'לא צילום חדשות' "$page" || grep -q 'not a news photograph' "$page"; then
              echo "no long AI disclaimer on $page"
              exit 1
            fi
            grep -q 'class="illus-caption"' "$page"
            grep -q 'המחשה (AI)' "$page"
            grep -q 'AI Illustration' "$page"
          done
          for page in index.html briefings/2026-09-25-1545/index.html briefings/2026-09-25-1400/index.html; do
            test "$(grep -c 'class="illus-caption"' "$page")" -eq 6
            grep -q 'צילום: הצי האמריקאי' "$page"
            grep -q 'Carl Lender' "$page"
            grep -q 'NASA' "$page"
          done
          test "$(grep -c 'class="illus-caption"' templates/edition.html)" -eq 3
          if grep -q 'illus-label' assets/polish.css; then
            echo "polish.css does not style an AI badge"
            exit 1
          fi
          grep -q 'figcaption.illus-caption' assets/polish.css
          grep -q 'var(--muted)' assets/polish.css
          grep -q 'למה זה חשוב' index.html
          grep -q 'Why it matters' index.html
          grep -q 'crawl-track' index.html
          grep -q 'prefers-reduced-motion' assets/polish.css
          python3 -c 'from pathlib import Path; html=Path("index.html").read_text(); order=["mkt-drivers","mkt-catalysts","mkt-next","mkt-snap"]; pos=[html.find(t) for t in order]; assert pos==sorted(pos) and all(p>=0 for p in pos), "markets order"; assert html.count("class=\"why\"")>=8; assert html.count("crawl-seq")>=2'
          if grep -E -q '(href|src)="[^"]*(lanes\.js|brief\.css|paper\.css)"' \
            index.html \
            briefings/2026-09-25-1545/index.html \
            briefings/2026-09-25-1400/index.html \
            briefings/2026-09-25-0850/index.html \
            briefings/2026-09-24-1545/index.html \
            templates/edition.html \
            archive/index.html \
            preview/ux-2026-09-24/index.html
          then
            echo "editorial pages load edition.css and polish.css, not the card sheet"
            exit 1
          fi
          # Archive index is the newspaper sheet and still lists permalinks.
          grep -q 'edition.css' archive/index.html
          grep -q 'polish.css' archive/index.html
          grep -q 'edition-list' archive/index.html
          grep -q 'briefings/' archive/index.html
          grep -q 'color-scheme" content="dark"' archive/index.html
          # Older permalinks stay on the card sheet.
          grep -q 'brief.css' briefings/2026-09-24-1400/index.html
          grep -q 'brief.css' 404.html
          if [ -f assets/i18n.js ]; then
            grep -q 'brief-lang' assets/i18n.js
            echo "ok i18n.js"
          fi
          # lanes.js stays for card archives
          grep -q 'data-lane' assets/lanes.js
          echo "all checks passed"

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -R assets archive briefings preview templates _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
