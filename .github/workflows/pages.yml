            briefings/2026-09-30-1545/index.html \
            briefings/2026-09-30-1400/index.html \
            briefings/2026-09-30-0850/index.html \
            briefings/2026-09-29-1545/index.html \
            briefings/2026-09-29-0850/index.html \
            briefings/2026-09-28-1545/index.html \
            briefings/2026-09-28-1400/index.html \
            briefings/2026-09-28-0850/index.html \
            briefings/2026-09-27-1400/index.html \
            briefings/2026-09-27-0850/index.html \
            briefings/2026-09-26-1400/index.html \
            briefings/2026-09-26-0850/index.html \
            briefings/2026-09-25-1545/index.html \
            briefings/2026-09-25-1400/index.html \
            briefings/2026-09-25-0850/index.html \
            briefings/2026-09-24-1545/index.html \
            templates/edition.html \
            archive/index.html \
            preview/ux-2026-09-24/index.html
          then
            echo "editorial pages load edition.css and polish.css, not the card sheet"
            exit 1
          fi
          # Archive index is the newspaper sheet and still lists permalinks.
          grep -q 'edition.css' archive/index.html
          grep -q 'polish.css' archive/index.html
          grep -q 'edition-list' archive/index.html
          grep -q 'briefings/' archive/index.html
          grep -q 'briefings/2026-09-28-0850/' archive/index.html
          grep -q 'briefings/2026-09-28-1400/' archive/index.html
          grep -q 'briefings/2026-09-28-1545/' archive/index.html
          grep -q 'briefings/2026-09-29-0850/' archive/index.html
          grep -q 'briefings/2026-09-29-1545/' archive/index.html
          grep -q 'briefings/2026-09-30-0850/' archive/index.html
          grep -q 'briefings/2026-09-30-1400/' archive/index.html
          grep -q 'briefings/2026-09-30-1545/' archive/index.html
          grep -q 'briefings/2026-10-01-0850/' archive/index.html
          grep -q 'briefings/2026-10-01-1400/' archive/index.html
          grep -q 'color-scheme" content="dark"' archive/index.html
          # Older permalinks stay on the card sheet.
          grep -q 'brief.css' briefings/2026-09-24-1400/index.html
          grep -q 'brief.css' 404.html
          if [ -f assets/i18n.js ]; then
            grep -q 'brief-lang' assets/i18n.js
            echo "ok i18n.js"
          fi
          # lanes.js stays for card archives
          grep -q 'data-lane' assets/lanes.js
          echo "all checks passed"

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -R assets archive briefings preview templates _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
