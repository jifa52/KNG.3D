name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files
        run: |
          set -euo pipefail
          for f in \
            index.html \
            404.html \
            .nojekyll \
            assets/brief.css \
            assets/edition.css \
            assets/polish.css \
            assets/lanes.js \
            assets/favicon.svg \
