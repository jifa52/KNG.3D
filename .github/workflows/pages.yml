name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files
        run: |
          set -euo pipefail
          for f in \
            index.html \
            404.html \
            .nojekyll \
            assets/brief.css \
            assets/edition.css \
            assets/polish.css \
            assets/lanes.js \
            assets/favicon.svg \
            assets/images/trump-xi-1280.jpg \
            assets/images/albanese-800.jpg \
            assets/fonts/FrankRuhlLibre-700-hebrew.woff2 \
            assets/fonts/Heebo-400-hebrew.woff2 \
            archive/index.html \
            preview/ux-2026-09-24/index.html \
            preview/ux-2026-09-24-polish/index.html \
            preview/ux-2026-09-24-polish/IMAGE-CREDITS.md \
            briefings/2026-09-24-1545/IMAGE-CREDITS.md \
            templates/edition.html \
            templates/IMAGE-CREDITS.md \
            templates/PUBLISH.md
          do
            test -f "$f"
            echo "ok $f"
          done
          grep -q 'PREVIEW' preview/ux-2026-09-24/index.html
          grep -q 'edition.css' preview/ux-2026-09-24/index.html
          grep -q 'Frank Ruhl Libre' assets/edition.css
          grep -q '#8b1e2d' assets/edition.css
          grep -q '#ffffff' assets/edition.css
          grep -q 'mkt-board-primary' assets/polish.css
          # Live homepage is the approved polish sheet.
          for page in index.html briefings/2026-09-24-1545/index.html templates/edition.html; do
            grep -q 'edition.css' "$page"
            grep -q 'polish.css' "$page"
            grep -q 'edition-nav' "$page"
            grep -q 'id="news"' "$page"
            grep -q 'id="markets"' "$page"
            grep -q 'id="ai"' "$page"
            grep -q 'mkt-board-primary' "$page"
            grep -q 'mkt-board-secondary' "$page"
            grep -q 'mkt-board-cash' "$page"
            grep -q 'ai-lead' "$page"
            grep -q '#premarket' "$page"
            if grep -q 'img-ph' "$page"; then
              echo "no gray photo placeholder on $page"
              exit 1
            fi
            if grep -q 'mkt-table' "$page"; then
              echo "markets boards, not a table, on $page"
              exit 1
            fi
          done
          grep -q 'מדד, לא חוזה' index.html
          grep -q 'שער מט״ח' index.html
          grep -q 'Index, not futures' index.html
          grep -q 'FX spot' index.html
          if grep -E -q '(href|src)="[^"]*(lanes\.js|brief\.css|paper\.css)"' \
            index.html \
            briefings/2026-09-24-1545/index.html \
            templates/edition.html \
            archive/index.html \
            preview/ux-2026-09-24/index.html
          then
            echo "editorial pages load edition.css and polish.css, not the card sheet"
            exit 1
          fi
          # Archive index is the newspaper sheet and still lists permalinks.
          grep -q 'edition.css' archive/index.html
          grep -q 'polish.css' archive/index.html
          grep -q 'edition-list' archive/index.html
          grep -q 'briefings/' archive/index.html
          grep -q 'color-scheme" content="light"' archive/index.html
          # Older permalinks stay on the card sheet.
          grep -q 'brief.css' briefings/2026-09-24-1400/index.html
          grep -q 'brief.css' 404.html
          if [ -f assets/i18n.js ]; then
            grep -q 'brief-lang' assets/i18n.js
            echo "ok i18n.js"
          fi
          # lanes.js stays for card archives
          grep -q 'data-lane' assets/lanes.js
          echo "all checks passed"

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -R assets archive briefings preview templates _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
