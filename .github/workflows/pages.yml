name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files
        run: |
          set -euo pipefail
          for f in \
            index.html \
            404.html \
            .nojekyll \
            assets/brief.css \
            assets/edition.css \
            assets/lanes.js \
            assets/favicon.svg \
            assets/fonts/FrankRuhlLibre-700-hebrew.woff2 \
            assets/fonts/Heebo-400-hebrew.woff2 \
            archive/index.html \
            preview/ux-2026-09-24/index.html \
            templates/edition.html \
            templates/PUBLISH.md
          do
            test -f "$f"
            echo "ok $f"
          done
          grep -q 'PREVIEW' preview/ux-2026-09-24/index.html
          grep -q 'edition.css' preview/ux-2026-09-24/index.html
          grep -q 'Frank Ruhl Libre' assets/edition.css
          grep -q '#8b1e2d' assets/edition.css
          grep -q '#ffffff' assets/edition.css
          # Live homepage is the Modern editorial edition (cut over 24 Sep 2026).
          grep -q 'edition.css' index.html
          grep -q 'id="news"' index.html
          grep -q 'id="markets"' index.html
          grep -q 'id="ai"' index.html
          grep -q '#premarket' index.html
          grep -q 'edition.css' briefings/2026-09-24-1545/index.html
          if grep -q 'lanes.js' index.html briefings/2026-09-24-1545/index.html; then
            echo "editorial pages must not load lanes.js"
            exit 1
          fi
          if grep -q 'brief.css' index.html briefings/2026-09-24-1545/index.html; then
            echo "editorial pages use edition.css"
            exit 1
          fi
          if grep -q 'paper.css' index.html preview/ux-2026-09-24/index.html templates/edition.html briefings/2026-09-24-1545/index.html; then
            echo "paper.css is retired"
            exit 1
          fi
          # Older permalinks and the archive stay on the card sheet.
          grep -q 'brief.css' briefings/2026-09-24-1400/index.html
          grep -q 'brief.css' archive/index.html
          grep -q 'briefings/' archive/index.html
          if [ -f assets/i18n.js ]; then
            grep -q 'brief-lang' assets/i18n.js
            echo "ok i18n.js"
          fi
          # lanes.js stays for card archives
          grep -q 'data-lane' assets/lanes.js
          echo "all checks passed"

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -R assets archive briefings preview templates _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
