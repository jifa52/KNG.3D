name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files
        run: |
          set -euo pipefail
          for f in \
            index.html \
            404.html \
            .nojekyll \
            assets/brief.css \
            assets/lanes.js \
            assets/cards.js \
            assets/briefing.schema.json \
            assets/favicon.svg \
            archive/index.html \
            briefings/2026-09-02-2300/index.html \
            briefings/2026-09-02-2300/briefing.json
          do
            test -f "$f"
            echo "ok $f"
          done

      - name: Close copy has no invented photos
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("briefings/2026-09-02-2300/briefing.json").read_text())
          for card in data.get("cards", []):
              image = card.get("image") or {}
              if image.get("url"):
                  raise SystemExit(f"unexpected photo on {card.get('id')}")
          css = Path("assets/brief.css").read_text()
          js = Path("assets/cards.js").read_text()
          assert ".card-photo" in css
          assert "<img" in Path("index.html").read_text()
          assert "open photo" not in js.lower()
          print("ok photo chrome; tonight's Close has no shipped photos")
          PY

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -R assets archive briefings _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
