name: GitHub Pages

# Pages serves the main branch from the repository root. This workflow checks
# every push: the editions must be valid, and published editions stay frozen.
# Run it by hand (Actions → GitHub Pages → Run workflow) to deploy via Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check the paper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Editions, manifest and site files
        run: python3 tools/check.py

      - name: Published editions stay frozen
        if: github.event_name != 'workflow_dispatch'
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ -z "${BEFORE:-}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no base commit to compare; skipping"; exit 0
          fi
          if printf '%s' "$MSG" | grep -q '\[archive-fix\]' || git log "$BEFORE"..HEAD --format=%B | grep -q '\[archive-fix\]'; then
            echo "[archive-fix] in the commit message: edits to older editions allowed"; exit 0
          fi
          # The newest edition may still be corrected. Every older folder that
          # existed before this push must not be modified or deleted.
          newest=$(ls -1 briefings | sort | tail -1)
          bad=$(git diff --name-status "$BEFORE" HEAD -- briefings \
            | awk '$1 ~ /^(M|D|R)/ {print $2}' \
            | grep -v "^briefings/$newest/" || true)
          if [ -n "$bad" ]; then
            echo "These published editions were changed:"; echo "$bad"
            echo "Publish a new edition instead, or put [archive-fix] in the commit message for a deliberate fix."
            exit 1
          fi
          echo "ok: no published edition was changed"

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'workflow_dispatch'
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -R assets archive briefings templates _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
