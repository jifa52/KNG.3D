name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files
        run: |
          set -euo pipefail
          for f in \
            index.html \
            404.html \
            .nojekyll \
            assets/brief.css \
            assets/lanes.js \
            assets/favicon.svg \
            archive/index.html
          do
            test -f "$f"
            echo "ok $f"
          done
          # archive must have at least one briefing link
          grep -q 'briefings/' archive/index.html
          # home must carry the base structural markers (edition-agnostic)
          grep -q 'id="briefing"' index.html
          grep -q 'lane-news' index.html
          grep -q 'lane-markets' index.html
          # i18n asset only checked if it exists (optional in older editions)
          if [ -f assets/i18n.js ]; then
            grep -q 'brief-lang' assets/i18n.js
            echo "ok i18n.js"
          fi
          # lanes.js must exist and reference the lane switch
          grep -q 'data-lane' assets/lanes.js
          echo "all checks passed"

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -R assets archive briefings _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
